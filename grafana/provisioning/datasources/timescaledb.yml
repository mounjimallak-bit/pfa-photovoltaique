
apiVersion: 1

datasources:
  - name: TimescaleDB PFA
    uid: timescaledb-pfa
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: ${PGUSER}
    database: ${PGDATABASE}
    isDefault: true
    editable: true
    secureJsonData:
      password: ${PGPASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
